<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Pontua+</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <img src="/img/logopreto.png" alt="Pontua+" class="header-logo">
        <nav class="nav-menu">
            <a href="/professor-dashboard.html" class="nav-link active">Desempenho</a>
            <span class="nav-link disabled">Ranking</span>
            <span class="nav-link disabled">Recompensas</span>
            <span class="nav-link disabled">Eventos</span>
            <span class="nav-link disabled">Acessibilidade</span>
        </nav>
        <div class="user-info">
            <span id="userName">Carregando...</span>
            <a href="/colaborador-perfil.html" class="user-avatar" id="userAvatar" style="text-decoration:none;">P</a>
        </div>
    </header>

    <div class="container">

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando dados...</p>
        </div>

        <div id="dashboardContent" style="display:none;">

            <!-- MÉTRICAS -->
            <section class="metrics-grid">
                <div class="metric-card animate-fade-in-up">
                    <span class="metric-value" id="totalTurmas">—</span>
                    <span class="metric-label">Turmas</span>
                </div>
                <div class="metric-card animate-fade-in-up delay-100">
                    <span class="metric-value" id="totalAlunos">—</span>
                    <span class="metric-label">Alunos Ativos</span>
                </div>
                <div class="metric-card animate-fade-in-up delay-200">
                    <span class="metric-value" id="atividadesPendentes">—</span>
                    <span class="metric-label">Atividades Pendentes</span>
                </div>
            </section>

            <!-- LISTAGEM DE TURMAS -->
            <div class="card">
                <h2>Minhas Turmas</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Turma</th>
                            <th>Série</th>
                            <th>Alunos</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTurmas">
                        <tr><td colspan="4" style="text-align:center; color:#999;">Carregando turmas...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- MODAL DE LOGOUT -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-content">
            <h3>Deseja realmente sair?</h3>
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="logout()">Sair</button>
                <button class="btn-cancel" onclick="closeLogoutModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        function openLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
        function logout() { window.location.href = '/api/auth/logout'; }

        async function carregar() {
            try {
                const [meRes, turmasRes] = await Promise.all([
                    fetch('/api/colaborador/me'),
                    fetch('/api/professor/turmas')
                ]);

                if (meRes.status === 401 || meRes.status === 403 ||
                    turmasRes.status === 401 || turmasRes.status === 403) {
                    window.location.href = '/login.html';
                    return;
                }

                const me = await meRes.json();
                const turmas = await turmasRes.json();

                document.getElementById('userName').textContent = me.nome || '';
                document.getElementById('userAvatar').textContent = (me.nome || '')
                    .split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('');

                const totalAlunos = turmas.reduce((sum, t) => sum + t.totalAlunos, 0);
                document.getElementById('totalTurmas').textContent = turmas.length;
                document.getElementById('totalAlunos').textContent = totalAlunos;

                const tbody = document.getElementById('listaTurmas');
                if (turmas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">Nenhuma turma cadastrada</td></tr>';
                } else {
                    tbody.innerHTML = turmas.map(t => `
                        <tr>
                            <td>${escapeHtml(t.turma || '—')}</td>
                            <td>${escapeHtml(t.serie || '—')}</td>
                            <td>${t.totalAlunos}</td>
                            <td><a href="#" class="btn btn-primary">Acessar</a></td>
                        </tr>
                    `).join('');
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = String(value ?? '');
            return div.innerHTML;
        }

        window.addEventListener('DOMContentLoaded', carregar);
    </script>

</body>
</html>
